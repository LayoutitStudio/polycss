<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>polycss perf - non-voxel vanilla JS</title>
  <style id="overlay-css"></style>
</head>
<body>
  <div id="host"></div>

  <script type="module">
    import { createPolyScene, createPolyOrbitControls, loadMesh } from "./polycss.js";
    import { getSynthMesh } from "./synth-mesh.mjs";
    import {
      parseUrlParams, dirFromAzEl, createPerfRecorder,
      PERF_OVERLAY_HTML, PERF_OVERLAY_CSS,
    } from "./perf-shared.mjs";

    document.getElementById("overlay-css").textContent = PERF_OVERLAY_CSS;
    document.body.insertAdjacentHTML("beforeend", PERF_OVERLAY_HTML);

    const { meshId, mode, motion, az, el, isSynth, preset } = parseUrlParams();
    const benchParams = new URLSearchParams(window.location.search);
    const sceneTransformMode = benchParams.get("sceneTransformMode") || "default";
    const rotationDriver = benchParams.get("rotationDriver") || "js";
    const polygonOrder = benchParams.get("polygonOrder") || "source";
    const domOrder = benchParams.get("domOrder") || "source";
    const leafBucketSize = Number(benchParams.get("leafBucketSize") || 0);
    const disabledStrategies = (benchParams.get("disableStrategies") || "")
      .split(",")
      .map((value) => value.trim())
      .filter(Boolean);
    let azimuth = az;

    const host = document.getElementById("host");
    const scene = createPolyScene(host, {
      rotX: preset.rotX, rotY: preset.rotY, zoom: preset.zoom,
      directionalLight: { direction: dirFromAzEl(azimuth, el), color: "#ffffff", intensity: 1 },
      ambientLight: { color: "#ffffff", intensity: 0.4 },
      textureLighting: mode,
      autoCenter: true,
      ...(disabledStrategies.length > 0 ? { strategies: { disable: disabledStrategies } } : {}),
    });
    createPolyOrbitControls(scene, { drag: true, wheel: true });

    const sceneEl = host.querySelector(".polycss-scene");
    let splitShell = null;

    function formatMatrixTransform(transform) {
      const matrix = new DOMMatrix(transform || "none");
      return matrix.toString();
    }

    function scenePerspective() {
      return sceneEl?.style.perspective || getComputedStyle(sceneEl).perspective || "8000px";
    }

    function ensureSplitShell() {
      if (splitShell || !sceneEl) return splitShell;
      splitShell = document.createElement("div");
      splitShell.style.cssText = [
        "position:absolute",
        "top:0",
        "left:0",
        "width:0",
        "height:0",
        "transform-style:preserve-3d",
        "will-change:transform",
      ].join(";");
      while (sceneEl.firstChild) splitShell.appendChild(sceneEl.firstChild);
      sceneEl.appendChild(splitShell);
      return splitShell;
    }

    function applySceneTransformMode() {
      if (!sceneEl || sceneTransformMode === "default") return;
      const transform = sceneEl.style.transform || "";
      if (sceneTransformMode === "matrix3d") {
        sceneEl.style.transform = formatMatrixTransform(transform);
        return;
      }
      if (sceneTransformMode === "split-target") {
        const shell = ensureSplitShell();
        const match = transform.match(/\s*translate3d\([^)]*\)\s*$/);
        if (!match) return;
        sceneEl.style.transform = transform.slice(0, match.index).trim();
        shell.style.transform = match[0].trim();
        return;
      }
      if (sceneTransformMode === "host-perspective") {
        host.style.perspective = scenePerspective();
        host.style.transformStyle = "preserve-3d";
        sceneEl.style.perspective = "none";
        return;
      }
      if (sceneTransformMode === "transform-perspective") {
        const perspective = scenePerspective();
        sceneEl.style.perspective = "none";
        sceneEl.style.transform = `perspective(${perspective}) ${transform}`;
        return;
      }
      if (sceneTransformMode === "no-will-change") {
        sceneEl.style.willChange = "auto";
      }
    }

    function centroid(polygon) {
      const out = [0, 0, 0];
      for (const vertex of polygon.vertices) {
        out[0] += vertex[0];
        out[1] += vertex[1];
        out[2] += vertex[2];
      }
      const n = polygon.vertices.length || 1;
      out[0] /= n;
      out[1] /= n;
      out[2] /= n;
      return out;
    }

    function polygonArea(polygon) {
      const vertices = polygon.vertices;
      if (vertices.length < 3) return 0;
      const v0 = vertices[0];
      let area = 0;
      for (let i = 1; i + 1 < vertices.length; i++) {
        const a = vertices[i];
        const b = vertices[i + 1];
        const ax = a[0] - v0[0], ay = a[1] - v0[1], az = a[2] - v0[2];
        const bx = b[0] - v0[0], by = b[1] - v0[1], bz = b[2] - v0[2];
        const cx = ay * bz - az * by;
        const cy = az * bx - ax * bz;
        const cz = ax * by - ay * bx;
        area += Math.hypot(cx, cy, cz) / 2;
      }
      return area;
    }

    function polygonNormalZ(polygon) {
      const vertices = polygon.vertices;
      if (vertices.length < 3) return 0;
      const v0 = vertices[0];
      let nz = 0;
      for (let i = 1; i + 1 < vertices.length; i++) {
        const v1 = vertices[i];
        const v2 = vertices[i + 1];
        const e1x = v1[1] - v0[1], e1y = v1[0] - v0[0], e1z = v1[2] - v0[2];
        const e2x = v2[1] - v0[1], e2y = v2[0] - v0[0], e2z = v2[2] - v0[2];
        nz -= e1x * e2y - e1y * e2x;
      }
      return nz;
    }

    function projectedCentroid(polygon) {
      const c = centroid(polygon);
      let x = c[1];
      let y = c[0];
      let z = c[2];
      const rz = (preset.rotY * Math.PI) / 180;
      const cosZ = Math.cos(rz);
      const sinZ = Math.sin(rz);
      const zx = x * cosZ - y * sinZ;
      const zy = x * sinZ + y * cosZ;
      x = zx;
      y = zy;
      const rx = (preset.rotX * Math.PI) / 180;
      const cosX = Math.cos(rx);
      const sinX = Math.sin(rx);
      return {
        x,
        y: y * cosX - z * sinX,
        z: y * sinX + z * cosX,
      };
    }

    function orderedPolygonIndexes(polygons, orderName) {
      if (orderName === "source") return polygons.map((_polygon, index) => index);
      const items = polygons.map((polygon, index) => ({
        polygon,
        index,
        area: polygonArea(polygon),
        normalZ: polygonNormalZ(polygon),
        projected: projectedCentroid(polygon),
      }));

      if (orderName === "area-desc") {
        items.sort((a, b) => b.area - a.area || a.index - b.index);
      } else if (orderName === "area-asc") {
        items.sort((a, b) => a.area - b.area || a.index - b.index);
      } else if (orderName === "normal-z") {
        items.sort((a, b) => b.normalZ - a.normalZ || a.index - b.index);
      } else if (orderName === "initial-depth") {
        items.sort((a, b) => b.projected.z - a.projected.z || a.index - b.index);
      } else if (orderName === "tile4-screen") {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const item of items) {
          minX = Math.min(minX, item.projected.x);
          minY = Math.min(minY, item.projected.y);
          maxX = Math.max(maxX, item.projected.x);
          maxY = Math.max(maxY, item.projected.y);
        }
        const spanX = Math.max(1e-6, maxX - minX);
        const spanY = Math.max(1e-6, maxY - minY);
        for (const item of items) {
          item.tileX = Math.max(0, Math.min(3, Math.floor(((item.projected.x - minX) / spanX) * 4)));
          item.tileY = Math.max(0, Math.min(3, Math.floor(((item.projected.y - minY) / spanY) * 4)));
        }
        items.sort((a, b) =>
          a.tileY - b.tileY ||
          a.tileX - b.tileX ||
          b.projected.z - a.projected.z ||
          a.index - b.index
        );
      }

      return items.map((item) => item.index);
    }

    function orderedPolygons(polygons) {
      return orderedPolygonIndexes(polygons, polygonOrder).map((index) => polygons[index]);
    }

    function applyPolygonBenchIndexes(parseResult) {
      parseResult.polygons.forEach((polygon, index) => {
        polygon.data = {
          ...(polygon.data ?? {}),
          "bench-index": index,
        };
      });
      return parseResult;
    }

    function applyPolygonOrder(parseResult) {
      if (polygonOrder === "source" || parseResult.voxelSource) return parseResult;
      return {
        ...parseResult,
        polygons: orderedPolygons(parseResult.polygons),
      };
    }

    function elementDomOrderRank(element, ranks) {
      if (element.classList.contains("polycss-bucket")) {
        let best = Infinity;
        for (const child of Array.from(element.children)) {
          const rank = elementDomOrderRank(child, ranks);
          if (rank < best) best = rank;
        }
        return best;
      }
      const index = element.getAttribute("data-bench-index");
      return index === null ? Infinity : (ranks.get(Number(index)) ?? Infinity);
    }

    function sortDirectRenderableChildren(parent, ranks) {
      const sortable = Array.from(parent.children).filter((child) => {
        if (!(child instanceof HTMLElement)) return false;
        if (child.classList.contains("polycss-shadow")) return false;
        if (child.classList.contains("polycss-bucket")) return true;
        return ["b", "i", "s", "u"].includes(child.tagName.toLowerCase());
      });
      sortable.sort((a, b) =>
        elementDomOrderRank(a, ranks) - elementDomOrderRank(b, ranks)
      );
      for (const child of sortable) parent.appendChild(child);
    }

    function applyDomOrder(parseResult) {
      if (domOrder === "source" || parseResult.voxelSource) return;
      const ranks = new Map();
      orderedPolygonIndexes(parseResult.polygons, domOrder)
        .forEach((polygonIndex, rank) => ranks.set(polygonIndex, rank));
      for (const wrapper of host.querySelectorAll(".polycss-mesh")) {
        for (const child of Array.from(wrapper.children)) {
          if (child instanceof HTMLElement && child.classList.contains("polycss-bucket")) {
            sortDirectRenderableChildren(child, ranks);
          }
        }
        sortDirectRenderableChildren(wrapper, ranks);
      }
    }

    function isRenderableLeaf(element) {
      return element instanceof HTMLElement &&
        ["b", "i", "s", "u"].includes(element.tagName.toLowerCase());
    }

    function applyLeafBuckets() {
      if (!Number.isFinite(leafBucketSize) || leafBucketSize < 2) return;
      for (const wrapper of host.querySelectorAll(".polycss-mesh")) {
        const leaves = Array.from(wrapper.children).filter(isRenderableLeaf);
        if (leaves.length <= leafBucketSize) continue;
        for (let i = 0; i < leaves.length; i += leafBucketSize) {
          const bucket = document.createElement("div");
          bucket.className = "polycss-bucket polycss-bench-leaf-bucket";
          bucket.style.cssText = "position:absolute;transform-style:preserve-3d";
          wrapper.insertBefore(bucket, leaves[i]);
          for (const leaf of leaves.slice(i, i + leafBucketSize)) bucket.appendChild(leaf);
        }
      }
    }

    function offsetRotate(transform, offsetDeg) {
      return transform.replace(
        /(^|\s)rotate\((-?\d+(?:\.\d+)?)deg\)/,
        (_match, prefix, value) => `${prefix}rotate(${Number(value) + offsetDeg}deg)`,
      );
    }

    function installCssKeyframeRotation() {
      if (!sceneEl || motion !== "rot" || rotationDriver !== "css-keyframes") return false;
      const startTransform = sceneEl.style.transform || getComputedStyle(sceneEl).transform;
      const endTransform = offsetRotate(startTransform, 360);
      if (startTransform === endTransform) return false;
      const name = `polycss-perf-rotate-${Math.random().toString(36).slice(2)}`;
      const style = document.createElement("style");
      style.textContent = `@keyframes ${name}{from{transform:${startTransform}}to{transform:${endTransform}}}`;
      document.head.appendChild(style);
      sceneEl.style.animation = `${name} 12000ms linear infinite`;
      return true;
    }

    const meshPromise = isSynth
      ? Promise.resolve(getSynthMesh(meshId))
      : loadMesh(preset.url, {
          ...(preset.mtlUrl ? { mtlUrl: preset.mtlUrl } : {}),
          objOptions: preset.options,
        });

    meshPromise.then((rawParseResult) => {
      if (!rawParseResult) throw new Error(`Unknown synth mesh: ${meshId}`);
      const indexedParseResult = applyPolygonBenchIndexes(rawParseResult);
      const parseResult = applyPolygonOrder(indexedParseResult);
      scene.add(parseResult);
      applyDomOrder(indexedParseResult);
      applyLeafBuckets();
      applySceneTransformMode();
      const cssDrivenRotation = installCssKeyframeRotation();

      const recorder = createPerfRecorder({
        rendererLabel: "nonvoxel-vanilla",
        meshId, mode, motion,
        polyCount: parseResult.polygons.length,
        polygons: parseResult.polygons,
      });

      let frameCount = 0;
      function tick(now) {
        recorder.onFrame(now);
        frameCount += 1;
        if (motion === "light") {
          azimuth = (azimuth + 0.5) % 360;
          scene.setOptions({
            directionalLight: { direction: dirFromAzEl(azimuth, el), color: "#ffffff", intensity: 1 },
          });
        } else if (motion === "rot") {
          const newRotY = ((preset.rotY + frameCount * 0.5) + 360) % 360;
          if (!cssDrivenRotation) {
            scene.setOptions({ rotY: newRotY });
            applySceneTransformMode();
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }).catch((err) => {
      console.error("nonvoxel-vanilla mesh load failed", err);
      document.getElementById("fps-now").textContent = "ERR";
    });
  </script>
</body>
</html>
