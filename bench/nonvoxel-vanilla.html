<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>polycss perf - non-voxel vanilla JS</title>
  <style id="overlay-css"></style>
</head>
<body>
  <div id="host"></div>

  <script type="module">
    import { createPolyCamera, createPolyScene, createPolyOrbitControls, loadMesh } from "./.generated/polycss.js";
    import { getSynthMesh } from "./synth-mesh.mjs";
    import {
      parseUrlParams, dirFromAzEl, createPerfRecorder,
      PERF_OVERLAY_HTML, PERF_OVERLAY_CSS,
    } from "./perf-shared.mjs";

    document.getElementById("overlay-css").textContent = PERF_OVERLAY_CSS;
    document.body.insertAdjacentHTML("beforeend", PERF_OVERLAY_HTML);

    const { meshId, mode, motion, az, el, isSynth, preset } = parseUrlParams();
    const benchParams = new URLSearchParams(window.location.search);
    const sceneTransformMode = benchParams.get("sceneTransformMode") || "default";
    const rotationDriver = benchParams.get("rotationDriver") || "js";
    const polygonOrder = benchParams.get("polygonOrder") || "source";
    const domOrder = benchParams.get("domOrder") || "source";
    const leafBucketSize = Number(benchParams.get("leafBucketSize") || 0);
    const islandBucketMode = benchParams.get("islandBucket") || "none";
    const islandBucketSize = Number(benchParams.get("islandBucketSize") || 128);
    const islandBucketSurface = benchParams.get("islandBucketSurface") || "none";
    const displayCullMode = benchParams.get("displayCull") || "none";
    const displayCullBias = Number(benchParams.get("displayCullBias") || 0);
    const displayCullDecimals = Number(benchParams.get("displayCullDecimals") || 1);
    const displayCullMinBucketSize = Number(benchParams.get("displayCullMinBucketSize") || 2);
    const recordFrameWork = benchParams.get("frameWork") === "1";
    const disabledStrategies = (benchParams.get("disableStrategies") || "")
      .split(",")
      .map((value) => value.trim())
      .filter(Boolean);
    let azimuth = az;

    const host = document.getElementById("host");
    const camera = createPolyCamera({ rotX: preset.rotX, rotY: preset.rotY, zoom: preset.zoom });
    const scene = createPolyScene(host, {
      camera,
      directionalLight: { direction: dirFromAzEl(azimuth, el), color: "#ffffff", intensity: 1 },
      ambientLight: { color: "#ffffff", intensity: 0.4 },
      textureLighting: mode,
      autoCenter: true,
      ...(disabledStrategies.length > 0 ? { strategies: { disable: disabledStrategies } } : {}),
    });
    const frameWork = createFrameWorkRecorder(recordFrameWork);
    if (recordFrameWork) instrumentCameraAndScene();
    const controls = createPolyOrbitControls(scene, { drag: true, wheel: true });
    const interactionStats = {
      starts: 0,
      changes: 0,
      ends: 0,
      cumulativeRotY: 0,
      lastRotY: scene.camera.state.rotY ?? preset.rotY,
    };

    function cloneCameraState() {
      const state = scene.camera.state;
      const target = state.target ?? [0, 0, 0];
      return {
        rotX: state.rotX ?? 0,
        rotY: state.rotY ?? 0,
        zoom: state.zoom ?? 0,
        distance: state.distance ?? 0,
        target: [target[0], target[1], target[2]],
      };
    }

    function unwrapAngleDelta(next, previous) {
      let delta = next - previous;
      if (delta > 180) delta -= 360;
      if (delta < -180) delta += 360;
      return delta;
    }

    function resetInteractionStats() {
      interactionStats.starts = 0;
      interactionStats.changes = 0;
      interactionStats.ends = 0;
      interactionStats.cumulativeRotY = 0;
      interactionStats.lastRotY = scene.camera.state.rotY ?? preset.rotY;
      frameWork.reset();
    }

    controls.addEventListener("start", () => {
      frameWork.record("controls.start");
      interactionStats.starts += 1;
    });
    controls.addEventListener("change", ({ camera }) => {
      frameWork.record("controls.change");
      interactionStats.cumulativeRotY += unwrapAngleDelta(camera.rotY, interactionStats.lastRotY);
      interactionStats.lastRotY = camera.rotY;
      interactionStats.changes += 1;
    });
    controls.addEventListener("end", () => {
      frameWork.record("controls.end");
      interactionStats.ends += 1;
    });

    window.__nonvoxelBench = {
      ready: false,
      cameraState: cloneCameraState,
      interactionStats: () => ({ ...interactionStats }),
      frameWorkSamples: () => frameWork.samples(),
      resetInteractionStats,
      cullStats: () => displayCullStats,
      setRotY(rotY) {
        scene.camera.update({ rotY });
        scene.applyCamera();
        applySceneTransformMode();
        displayCullController?.update(rotY, scene.camera.state.rotX ?? preset.rotX);
      },
    };

    const sceneEl = host.querySelector(".polycss-scene");
    let splitShell = null;
    let displayCullController = null;
    let displayCullStats = null;

    function formatMatrixTransform(transform) {
      const matrix = new DOMMatrix(transform || "none");
      return matrix.toString();
    }

    function scenePerspective() {
      return sceneEl?.style.perspective || getComputedStyle(sceneEl).perspective || "8000px";
    }

    function createFrameWorkRecorder(enabled) {
      let current = {};
      const frameSamples = [];

      function record(name, durationMs = 0) {
        if (!enabled) return;
        const entry = current[name] ?? { count: 0, duration_ms: 0 };
        entry.count += 1;
        entry.duration_ms += Number.isFinite(durationMs) ? durationMs : 0;
        current[name] = entry;
      }

      function snapshot(now) {
        if (!enabled) return;
        frameSamples.push({
          t: now,
          ops: Object.fromEntries(Object.entries(current).map(([name, entry]) => [
            name,
            {
              count: entry.count,
              duration_ms: +entry.duration_ms.toFixed(4),
            },
          ])),
        });
        current = {};
        if (frameSamples.length > 1800) {
          frameSamples.splice(0, frameSamples.length - 1800);
        }
      }

      return {
        record,
        snapshot,
        reset() {
          if (!enabled) return;
          current = {};
          frameSamples.length = 0;
        },
        samples() {
          return frameSamples.slice();
        },
      };
    }

    function timedFrameWork(name, fn) {
      const start = performance.now();
      try {
        return fn();
      } finally {
        frameWork.record(name, performance.now() - start);
      }
    }

    function instrumentCameraAndScene() {
      const cameraUpdate = camera.update.bind(camera);
      camera.update = (next) => timedFrameWork("camera.update", () => cameraUpdate(next));

      const sceneApplyCamera = scene.applyCamera.bind(scene);
      scene.applyCamera = () => timedFrameWork("scene.applyCamera", () => sceneApplyCamera());

      host.addEventListener("pointerdown", () => frameWork.record("input.pointerdown"), { capture: true });
      host.addEventListener("pointermove", () => frameWork.record("input.pointermove"), { capture: true });
      host.addEventListener("pointerup", () => frameWork.record("input.pointerup"), { capture: true });
      host.addEventListener("pointercancel", () => frameWork.record("input.pointercancel"), { capture: true });
      host.addEventListener("wheel", () => frameWork.record("input.wheel"), { capture: true, passive: true });
    }

    function ensureSplitShell() {
      if (splitShell || !sceneEl) return splitShell;
      splitShell = document.createElement("div");
      splitShell.style.cssText = [
        "position:absolute",
        "top:0",
        "left:0",
        "width:0",
        "height:0",
        "transform-style:preserve-3d",
        "will-change:transform",
      ].join(";");
      while (sceneEl.firstChild) splitShell.appendChild(sceneEl.firstChild);
      sceneEl.appendChild(splitShell);
      return splitShell;
    }

    function applySceneTransformMode() {
      if (!sceneEl || sceneTransformMode === "default") return;
      const transform = sceneEl.style.transform || "";
      if (sceneTransformMode === "matrix3d") {
        sceneEl.style.transform = formatMatrixTransform(transform);
        return;
      }
      if (sceneTransformMode === "split-target") {
        const shell = ensureSplitShell();
        const match = transform.match(/\s*translate3d\([^)]*\)\s*$/);
        if (!match) return;
        sceneEl.style.transform = transform.slice(0, match.index).trim();
        shell.style.transform = match[0].trim();
        return;
      }
      if (sceneTransformMode === "host-perspective") {
        host.style.perspective = scenePerspective();
        host.style.transformStyle = "preserve-3d";
        sceneEl.style.perspective = "none";
        return;
      }
      if (sceneTransformMode === "transform-perspective") {
        const perspective = scenePerspective();
        sceneEl.style.perspective = "none";
        sceneEl.style.transform = `perspective(${perspective}) ${transform}`;
        return;
      }
      if (sceneTransformMode === "no-will-change") {
        sceneEl.style.willChange = "auto";
      }
    }

    function centroid(polygon) {
      const out = [0, 0, 0];
      for (const vertex of polygon.vertices) {
        out[0] += vertex[0];
        out[1] += vertex[1];
        out[2] += vertex[2];
      }
      const n = polygon.vertices.length || 1;
      out[0] /= n;
      out[1] /= n;
      out[2] /= n;
      return out;
    }

    function polygonArea(polygon) {
      const vertices = polygon.vertices;
      if (vertices.length < 3) return 0;
      const v0 = vertices[0];
      let area = 0;
      for (let i = 1; i + 1 < vertices.length; i++) {
        const a = vertices[i];
        const b = vertices[i + 1];
        const ax = a[0] - v0[0], ay = a[1] - v0[1], az = a[2] - v0[2];
        const bx = b[0] - v0[0], by = b[1] - v0[1], bz = b[2] - v0[2];
        const cx = ay * bz - az * by;
        const cy = az * bx - ax * bz;
        const cz = ax * by - ay * bx;
        area += Math.hypot(cx, cy, cz) / 2;
      }
      return area;
    }

    function polygonNormalZ(polygon) {
      return polygonNormal(polygon)[2];
    }

    function polygonNormal(polygon) {
      const vertices = polygon.vertices;
      if (vertices.length < 3) return [0, 0, 0];
      const v0 = vertices[0];
      let nx = 0, ny = 0, nz = 0;
      for (let i = 1; i + 1 < vertices.length; i++) {
        const v1 = vertices[i];
        const v2 = vertices[i + 1];
        const e1x = v1[1] - v0[1], e1y = v1[0] - v0[0], e1z = v1[2] - v0[2];
        const e2x = v2[1] - v0[1], e2y = v2[0] - v0[0], e2z = v2[2] - v0[2];
        nx -= e1y * e2z - e1z * e2y;
        ny -= e1z * e2x - e1x * e2z;
        nz -= e1x * e2y - e1y * e2x;
      }
      const len = Math.hypot(nx, ny, nz) || 1;
      return [nx / len, ny / len, nz / len];
    }

    function projectedCentroid(polygon) {
      const c = centroid(polygon);
      let x = c[1];
      let y = c[0];
      let z = c[2];
      const rz = (preset.rotY * Math.PI) / 180;
      const cosZ = Math.cos(rz);
      const sinZ = Math.sin(rz);
      const zx = x * cosZ - y * sinZ;
      const zy = x * sinZ + y * cosZ;
      x = zx;
      y = zy;
      const rx = (preset.rotX * Math.PI) / 180;
      const cosX = Math.cos(rx);
      const sinX = Math.sin(rx);
      return {
        x,
        y: y * cosX - z * sinX,
        z: y * sinX + z * cosX,
      };
    }

    function orderedPolygonIndexes(polygons, orderName) {
      if (orderName === "source") return polygons.map((_polygon, index) => index);
      const items = polygons.map((polygon, index) => ({
        polygon,
        index,
        area: polygonArea(polygon),
        normalZ: polygonNormalZ(polygon),
        projected: projectedCentroid(polygon),
      }));

      if (orderName === "area-desc") {
        items.sort((a, b) => b.area - a.area || a.index - b.index);
      } else if (orderName === "area-asc") {
        items.sort((a, b) => a.area - b.area || a.index - b.index);
      } else if (orderName === "normal-z") {
        items.sort((a, b) => b.normalZ - a.normalZ || a.index - b.index);
      } else if (orderName === "initial-depth") {
        items.sort((a, b) => b.projected.z - a.projected.z || a.index - b.index);
      } else if (orderName === "tile4-screen") {
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
        for (const item of items) {
          minX = Math.min(minX, item.projected.x);
          minY = Math.min(minY, item.projected.y);
          maxX = Math.max(maxX, item.projected.x);
          maxY = Math.max(maxY, item.projected.y);
        }
        const spanX = Math.max(1e-6, maxX - minX);
        const spanY = Math.max(1e-6, maxY - minY);
        for (const item of items) {
          item.tileX = Math.max(0, Math.min(3, Math.floor(((item.projected.x - minX) / spanX) * 4)));
          item.tileY = Math.max(0, Math.min(3, Math.floor(((item.projected.y - minY) / spanY) * 4)));
        }
        items.sort((a, b) =>
          a.tileY - b.tileY ||
          a.tileX - b.tileX ||
          b.projected.z - a.projected.z ||
          a.index - b.index
        );
      }

      return items.map((item) => item.index);
    }

    function orderedPolygons(polygons) {
      return orderedPolygonIndexes(polygons, polygonOrder).map((index) => polygons[index]);
    }

    function applyPolygonBenchIndexes(parseResult) {
      parseResult.polygons.forEach((polygon, index) => {
        polygon.data = {
          ...(polygon.data ?? {}),
          "bench-index": index,
        };
      });
      return parseResult;
    }

    function applyPolygonOrder(parseResult) {
      if (polygonOrder === "source" || parseResult.voxelSource) return parseResult;
      return {
        ...parseResult,
        polygons: orderedPolygons(parseResult.polygons),
      };
    }

    function elementDomOrderRank(element, ranks) {
      if (element.classList.contains("polycss-bucket")) {
        let best = Infinity;
        for (const child of Array.from(element.children)) {
          const rank = elementDomOrderRank(child, ranks);
          if (rank < best) best = rank;
        }
        return best;
      }
      const index = element.getAttribute("data-bench-index");
      return index === null ? Infinity : (ranks.get(Number(index)) ?? Infinity);
    }

    function sortDirectRenderableChildren(parent, ranks) {
      const sortable = Array.from(parent.children).filter((child) => {
        if (!(child instanceof HTMLElement)) return false;
        if (child.classList.contains("polycss-shadow")) return false;
        if (child.classList.contains("polycss-bucket")) return true;
        return ["b", "i", "s", "u"].includes(child.tagName.toLowerCase());
      });
      sortable.sort((a, b) =>
        elementDomOrderRank(a, ranks) - elementDomOrderRank(b, ranks)
      );
      for (const child of sortable) parent.appendChild(child);
    }

    function applyDomOrder(parseResult) {
      if (domOrder === "source" || parseResult.voxelSource) return;
      const ranks = new Map();
      orderedPolygonIndexes(parseResult.polygons, domOrder)
        .forEach((polygonIndex, rank) => ranks.set(polygonIndex, rank));
      for (const wrapper of host.querySelectorAll(".polycss-mesh")) {
        for (const child of Array.from(wrapper.children)) {
          if (child instanceof HTMLElement && child.classList.contains("polycss-bucket")) {
            sortDirectRenderableChildren(child, ranks);
          }
        }
        sortDirectRenderableChildren(wrapper, ranks);
      }
    }

    function isRenderableLeaf(element) {
      return element instanceof HTMLElement &&
        ["b", "i", "s", "u"].includes(element.tagName.toLowerCase());
    }

    function applyLeafBuckets() {
      if (!Number.isFinite(leafBucketSize) || leafBucketSize < 2) return;
      for (const wrapper of host.querySelectorAll(".polycss-mesh")) {
        const leaves = Array.from(wrapper.children).filter(isRenderableLeaf);
        if (leaves.length <= leafBucketSize) continue;
        for (let i = 0; i < leaves.length; i += leafBucketSize) {
          const bucket = document.createElement("div");
          bucket.className = "polycss-bucket polycss-bench-leaf-bucket";
          bucket.style.cssText = "position:absolute;transform-style:preserve-3d";
          wrapper.insertBefore(bucket, leaves[i]);
          for (const leaf of leaves.slice(i, i + leafBucketSize)) bucket.appendChild(leaf);
        }
      }
    }

    function brushKey(polygon) {
      return polygon.material?.key ?? polygon.material?.name ?? polygon.color ?? polygon.texture ?? "none";
    }

    function vertexKey(vertex) {
      return `${vertex[0].toFixed(5)},${vertex[1].toFixed(5)},${vertex[2].toFixed(5)}`;
    }

    function connectedComponentIds(polygons) {
      const parent = polygons.map((_polygon, index) => index);
      const find = (index) => {
        while (parent[index] !== index) {
          parent[index] = parent[parent[index]];
          index = parent[index];
        }
        return index;
      };
      const union = (a, b) => {
        const ar = find(a);
        const br = find(b);
        if (ar !== br) parent[br] = ar;
      };
      const byVertex = new Map();
      polygons.forEach((polygon, index) => {
        const seen = new Set();
        for (const vertex of polygon.vertices) {
          const key = vertexKey(vertex);
          if (seen.has(key)) continue;
          seen.add(key);
          const prev = byVertex.get(key);
          if (prev === undefined) byVertex.set(key, index);
          else union(index, prev);
        }
      });
      return polygons.map((_polygon, index) => find(index));
    }

    function splitSpatialItems(items, maxSize) {
      if (items.length <= maxSize) return [items];
      const bounds = [
        [Infinity, -Infinity],
        [Infinity, -Infinity],
        [Infinity, -Infinity],
      ];
      for (const item of items) {
        const c = item.centroid;
        for (let axis = 0; axis < 3; axis += 1) {
          bounds[axis][0] = Math.min(bounds[axis][0], c[axis]);
          bounds[axis][1] = Math.max(bounds[axis][1], c[axis]);
        }
      }
      let axis = 0;
      if (bounds[1][1] - bounds[1][0] > bounds[axis][1] - bounds[axis][0]) axis = 1;
      if (bounds[2][1] - bounds[2][0] > bounds[axis][1] - bounds[axis][0]) axis = 2;
      const sorted = items.slice().sort((a, b) => a.centroid[axis] - b.centroid[axis] || a.index - b.index);
      const mid = Math.ceil(sorted.length / 2);
      return [
        ...splitSpatialItems(sorted.slice(0, mid), maxSize),
        ...splitSpatialItems(sorted.slice(mid), maxSize),
      ];
    }

    function islandGroups(polygons) {
      if (islandBucketMode === "none") return [];
      const maxSize = Math.max(2, Math.floor(Number.isFinite(islandBucketSize) ? islandBucketSize : 128));
      const componentIds = islandBucketMode.includes("connected")
        ? connectedComponentIds(polygons)
        : polygons.map(() => 0);
      const baseGroups = new Map();
      polygons.forEach((polygon, index) => {
        const keyParts = [];
        if (islandBucketMode.includes("brush")) keyParts.push(brushKey(polygon));
        if (islandBucketMode.includes("connected")) keyParts.push(componentIds[index]);
        if (keyParts.length === 0) keyParts.push("all");
        const key = keyParts.join("|");
        const item = {
          index,
          centroid: centroid(polygon),
        };
        const group = baseGroups.get(key);
        if (group) group.push(item);
        else baseGroups.set(key, [item]);
      });

      const out = [];
      for (const group of baseGroups.values()) {
        if (islandBucketMode.includes("spatial")) {
          out.push(...splitSpatialItems(group, maxSize));
        } else {
          out.push(group);
        }
      }
      return out.filter((group) => group.length > 1);
    }

    function applyIslandBuckets(parseResult) {
      const groups = islandGroups(parseResult.polygons);
      if (groups.length === 0) return;
      const leafByIndex = new Map();
      for (const leaf of host.querySelectorAll(".polycss-mesh b,.polycss-mesh i,.polycss-mesh s,.polycss-mesh u")) {
        const index = Number(leaf.getAttribute("data-bench-index"));
        if (Number.isFinite(index)) leafByIndex.set(index, leaf);
      }
      for (const group of groups) {
        const leaves = group
          .map((item) => leafByIndex.get(item.index))
          .filter((leaf) => leaf instanceof HTMLElement && leaf.parentElement);
        if (leaves.length < 2) continue;
        leaves.sort((a, b) => {
          const position = a.compareDocumentPosition(b);
          if (position & Node.DOCUMENT_POSITION_FOLLOWING) return -1;
          if (position & Node.DOCUMENT_POSITION_PRECEDING) return 1;
          return 0;
        });
        const parent = leaves[0].parentElement;
        if (!parent) continue;
        const bucket = document.createElement("div");
        bucket.className = "polycss-bucket polycss-bench-island-bucket";
        bucket.style.position = "absolute";
        bucket.style.transformStyle = islandBucketSurface === "flat" ? "flat" : "preserve-3d";
        if (islandBucketSurface === "opacity") {
          bucket.style.opacity = "0.999";
          bucket.style.willChange = "transform";
        } else if (islandBucketSurface === "contain") {
          bucket.style.contain = "paint";
          bucket.style.willChange = "transform";
        }
        parent.insertBefore(bucket, leaves[0]);
        for (const leaf of leaves) bucket.appendChild(leaf);
      }
    }

    function rotateNormal(normal, rotXDeg, rotYDeg) {
      let [x, y, z] = normal;
      const rz = (rotYDeg * Math.PI) / 180;
      const cosZ = Math.cos(rz);
      const sinZ = Math.sin(rz);
      const zx = x * cosZ - y * sinZ;
      const zy = x * sinZ + y * cosZ;
      x = zx;
      y = zy;
      const rx = (rotXDeg * Math.PI) / 180;
      const cosX = Math.cos(rx);
      const sinX = Math.sin(rx);
      return [x, y * cosX - z * sinX, y * sinX + z * cosX];
    }

    function normalBucketKey(normal) {
      const decimals = Math.max(0, Math.min(4, Math.floor(Number.isFinite(displayCullDecimals) ? displayCullDecimals : 1)));
      return normal.map((value) => value.toFixed(decimals)).join(",");
    }

    function applyNormalCullBuckets(parseResult) {
      if (!displayCullMode.startsWith("normal-bucket")) return;
      const minBucketSize = Math.max(2, Math.floor(Number.isFinite(displayCullMinBucketSize) ? displayCullMinBucketSize : 2));
      const groups = new Map();
      parseResult.polygons.forEach((polygon, index) => {
        const normal = polygonNormal(polygon);
        const key = normalBucketKey(normal);
        const group = groups.get(key) ?? { normal: [0, 0, 0], indexes: [] };
        group.normal[0] += normal[0];
        group.normal[1] += normal[1];
        group.normal[2] += normal[2];
        group.indexes.push(index);
        groups.set(key, group);
      });
      const leafByIndex = new Map();
      for (const leaf of host.querySelectorAll(".polycss-mesh b,.polycss-mesh i,.polycss-mesh s,.polycss-mesh u")) {
        const index = Number(leaf.getAttribute("data-bench-index"));
        if (Number.isFinite(index)) leafByIndex.set(index, leaf);
      }
      for (const group of groups.values()) {
        if (group.indexes.length < minBucketSize) continue;
        const len = Math.hypot(group.normal[0], group.normal[1], group.normal[2]) || 1;
        const normal = group.normal.map((value) => value / len);
        const leaves = group.indexes
          .map((index) => leafByIndex.get(index))
          .filter((leaf) => leaf instanceof HTMLElement && leaf.parentElement);
        if (leaves.length < 2) continue;
        leaves.sort((a, b) => {
          const position = a.compareDocumentPosition(b);
          if (position & Node.DOCUMENT_POSITION_FOLLOWING) return -1;
          if (position & Node.DOCUMENT_POSITION_PRECEDING) return 1;
          return 0;
        });
        const parent = leaves[0].parentElement;
        if (!parent) continue;
        const bucket = document.createElement("div");
        bucket.className = "polycss-bucket polycss-bench-normal-cull-bucket";
        bucket.style.cssText = "position:absolute;transform-style:preserve-3d";
        bucket.dataset.cullNormal = normal.join(",");
        parent.insertBefore(bucket, leaves[0]);
        for (const leaf of leaves) bucket.appendChild(leaf);
      }
    }

    function createDisplayCullController(polygons) {
      if (displayCullMode === "none") return null;
      const visibleWhenPositive = displayCullMode.endsWith("positive");
      if (displayCullMode.startsWith("normal-bucket")) {
        const entries = Array.from(host.querySelectorAll(".polycss-bench-normal-cull-bucket"))
          .map((bucket) => {
            const normal = (bucket.dataset.cullNormal ?? "")
              .split(",")
              .map((value) => Number(value));
            return normal.length === 3 && normal.every(Number.isFinite)
              ? { leaf: bucket, normal, size: bucket.querySelectorAll("b,i,s,u").length, visible: true }
              : null;
          })
          .filter(Boolean);
        return {
          update(rotY, rotX) {
            let visibleCount = 0;
            let visibleLeaves = 0;
            let changed = 0;
            for (const entry of entries) {
              const z = rotateNormal(entry.normal, rotX, rotY)[2];
              const visible = visibleWhenPositive ? z >= displayCullBias : z <= -displayCullBias;
              if (visible) {
                visibleCount += 1;
                visibleLeaves += entry.size;
              }
              if (entry.visible !== visible) {
                entry.leaf.style.display = visible ? "" : "none";
                entry.visible = visible;
                changed += 1;
              }
            }
            displayCullStats = {
              kind: "normal-bucket",
              total: entries.length,
              visible: visibleCount,
              hidden: entries.length - visibleCount,
              leaves: entries.reduce((sum, entry) => sum + entry.size, 0),
              visibleLeaves,
              hiddenLeaves: entries.reduce((sum, entry) => sum + entry.size, 0) - visibleLeaves,
              changed,
            };
            return displayCullStats;
          },
        };
      }
      const entries = [];
      for (const polygon of polygons) {
        const index = polygon.data?.["bench-index"];
        const leaf = index == null ? null : host.querySelector(`[data-bench-index="${index}"]`);
        if (!(leaf instanceof HTMLElement)) continue;
        entries.push({
          leaf,
          normal: polygonNormal(polygon),
          visible: true,
        });
      }
      return {
        update(rotY, rotX) {
          let visibleCount = 0;
          let changed = 0;
          for (const entry of entries) {
            const z = rotateNormal(entry.normal, rotX, rotY)[2];
            const visible = visibleWhenPositive ? z >= displayCullBias : z <= -displayCullBias;
            if (visible) visibleCount += 1;
            if (entry.visible !== visible) {
              entry.leaf.style.display = visible ? "" : "none";
              entry.visible = visible;
              changed += 1;
            }
          }
          displayCullStats = {
            kind: "leaf",
            total: entries.length,
            visible: visibleCount,
            hidden: entries.length - visibleCount,
            changed,
          };
          return displayCullStats;
        },
      };
    }

    function offsetRotate(transform, offsetDeg) {
      return transform.replace(
        /(^|\s)rotate\((-?\d+(?:\.\d+)?)deg\)/,
        (_match, prefix, value) => `${prefix}rotate(${Number(value) + offsetDeg}deg)`,
      );
    }

    function installCssKeyframeRotation() {
      if (!sceneEl || motion !== "rot" || rotationDriver !== "css-keyframes") return false;
      const startTransform = sceneEl.style.transform || getComputedStyle(sceneEl).transform;
      const endTransform = offsetRotate(startTransform, 360);
      if (startTransform === endTransform) return false;
      const name = `polycss-perf-rotate-${Math.random().toString(36).slice(2)}`;
      const style = document.createElement("style");
      style.textContent = `@keyframes ${name}{from{transform:${startTransform}}to{transform:${endTransform}}}`;
      document.head.appendChild(style);
      sceneEl.style.animation = `${name} 12000ms linear infinite`;
      return true;
    }

    function atlasLeavesReady() {
      const leaves = Array.from(host.querySelectorAll(".polycss-mesh s"));
      return leaves.every((leaf) => {
        const inlineBg = leaf.style.backgroundImage;
        const bg = inlineBg || getComputedStyle(leaf).backgroundImage;
        return leaf.style.opacity !== "0" && bg && bg !== "none";
      });
    }

    function markReadyWhenRenderPainted() {
      window.__perf__.ready = false;
      window.__nonvoxelBench.ready = false;

      function check() {
        if (atlasLeavesReady()) {
          window.__perf__.ready = true;
          window.__nonvoxelBench.ready = true;
          return;
        }
        requestAnimationFrame(check);
      }

      check();
    }

    const meshPromise = isSynth
      ? Promise.resolve(getSynthMesh(meshId))
      : loadMesh(preset.url, {
          ...(preset.mtlUrl ? { mtlUrl: preset.mtlUrl } : {}),
          objOptions: preset.options,
        });

    meshPromise.then((rawParseResult) => {
      if (!rawParseResult) throw new Error(`Unknown synth mesh: ${meshId}`);
      const indexedParseResult = applyPolygonBenchIndexes(rawParseResult);
      const parseResult = applyPolygonOrder(indexedParseResult);
      scene.add(parseResult);
      applyDomOrder(indexedParseResult);
      applyIslandBuckets(indexedParseResult);
      applyNormalCullBuckets(indexedParseResult);
      applyLeafBuckets();
      applySceneTransformMode();
      displayCullController = createDisplayCullController(indexedParseResult.polygons);
      displayCullController?.update(scene.camera.state.rotY ?? preset.rotY, scene.camera.state.rotX ?? preset.rotX);
      const cssDrivenRotation = installCssKeyframeRotation();

      const recorder = createPerfRecorder({
        rendererLabel: "nonvoxel-vanilla",
        meshId, mode, motion,
        polyCount: parseResult.polygons.length,
        polygons: parseResult.polygons,
      });
      markReadyWhenRenderPainted();

      let frameCount = 0;
      function tick(now) {
        frameWork.snapshot(now);
        recorder.onFrame(now);
        frameCount += 1;
        if (motion === "light") {
          azimuth = (azimuth + 0.5) % 360;
          scene.setOptions({
            directionalLight: { direction: dirFromAzEl(azimuth, el), color: "#ffffff", intensity: 1 },
          });
        } else if (motion === "rot") {
          const newRotY = ((preset.rotY + frameCount * 0.5) + 360) % 360;
          if (!cssDrivenRotation) {
            scene.camera.update({ rotY: newRotY });
            scene.applyCamera();
            applySceneTransformMode();
            displayCullController?.update(newRotY, scene.camera.state.rotX ?? preset.rotX);
          }
        }
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    }).catch((err) => {
      console.error("nonvoxel-vanilla mesh load failed", err);
      document.getElementById("fps-now").textContent = "ERR";
    });
  </script>
</body>
</html>
