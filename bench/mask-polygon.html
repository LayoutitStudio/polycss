<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PolyCSS mask polygon bench</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #101318;
      color: #d8e1ec;
      font: 12px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: 900px;
      perspective-origin: 50% 46%;
      contain: strict;
    }

    #world {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
      transform-origin: 0 0;
      transform-style: preserve-3d;
      will-change: transform;
    }

    #world[data-motion="orbit"] {
      animation: mask-poly-orbit 4200ms linear infinite;
    }

    #world[data-motion="static"] {
      transform: translate3d(0, 0, -260px) rotateX(57deg) rotateY(-18deg) rotateZ(0deg);
    }

    @keyframes mask-poly-orbit {
      from {
        transform: translate3d(0, 0, -260px) rotateX(57deg) rotateY(-18deg) rotateZ(0deg);
      }
      to {
        transform: translate3d(0, 0, -260px) rotateX(57deg) rotateY(342deg) rotateZ(360deg);
      }
    }

    .leaf {
      position: absolute;
      display: block;
      left: 0;
      top: 0;
      margin: 0;
      padding: 0;
      font: inherit;
      line-height: 0;
      text-decoration: none;
      transform-origin: 0 0;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      background-repeat: no-repeat;
      color: var(--paint, currentColor);
      will-change: transform;
      pointer-events: none;
    }

    .leaf.border {
      width: 16px;
      height: 16px;
      border-color: currentColor;
    }

    .leaf.border.bench-border-shape-var {
      border-shape: var(--border-shape);
    }

    .leaf.solid {
      background: currentColor;
    }

    .leaf.mask {
      background: currentColor;
      mask-mode: alpha;
      mask-repeat: no-repeat;
      mask-size: 100% 100%;
      -webkit-mask-repeat: no-repeat;
      -webkit-mask-size: 100% 100%;
    }

    .leaf.atlas {
      background-repeat: no-repeat;
    }

    .leaf.clip {
      background: currentColor;
    }

    .leaf.svg {
      overflow: visible;
    }

    .leaf.svg polygon,
    .leaf.svg path {
      fill: currentColor;
      stroke: none;
    }

    #hud {
      position: fixed;
      left: 12px;
      top: 10px;
      z-index: 2;
      color: #e7edf6;
      text-shadow: 0 1px 2px #000;
      white-space: pre;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage"><div id="world"></div></div>
  <div id="hud"></div>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const option = (name, fallback) => params.get(name) ?? fallback;
      const numberOption = (name, fallback, min, max) => {
        const value = Number(params.get(name));
        if (!Number.isFinite(value)) return fallback;
        return Math.max(min, Math.min(max, value));
      };

      const strategy = option("strategy", "mask");
      const svgMode = option("svgMode", "polygon").toLowerCase();
      const borderShapeSource = option("borderShapeSource", "inline").toLowerCase();
      const leafContain = option("leafContain", "none").toLowerCase();
      const leafWillChange = option("leafWillChange", "transform").toLowerCase();
      const leafIsolation = option("leafIsolation", "auto").toLowerCase();
      const borderStyleMode = option("borderStyle", "none").toLowerCase();
      const count = Math.round(numberOption("count", 3000, 1, 50000));
      const primitive = Math.round(numberOption("primitive", strategy === "border" ? 16 : 64, 4, 256));
      const target = numberOption("target", 64, 8, 256);
      const borderFunction = option("borderFunction", "polygon").toLowerCase();
      const borderInner = option("borderInner", "circle0").toLowerCase();
      const shapeId = option("shape", "hex");
      const motion = option("motion", "orbit");
      const jitter = numberOption("jitter", 0.34, 0, 1);

      const shapes = {
        hex: [[50, 0], [96, 24], [88, 78], [50, 100], [12, 78], [4, 24]],
        octagon: [[28, 0], [72, 0], [100, 28], [100, 72], [72, 100], [28, 100], [0, 72], [0, 28]],
        skew: [[38, 0], [100, 18], [84, 88], [44, 100], [0, 66], [10, 20]],
      };
      const points = shapes[shapeId] ?? shapes.hex;
      const world = document.getElementById("world");
      const hud = document.getElementById("hud");
      const borderFunctions = ["polygon", "polygonplain", "path", "shape", "circle", "ellipse", "xywh", "inset", "rect"];
      const borderInners = [
        "circle0",
        "circle0center",
        "ellipse0",
        "ellipse0center",
        "inset50",
        "inset100",
        "xywh0",
        "xywhcenter0",
        "rect0",
        "polygon000",
        "polygoncenter",
        "pathempty",
        "pathpoint",
        "shapepoint",
        "shapecenter",
      ];

      function signedArea(poly) {
        let area = 0;
        for (let i = 0; i < poly.length; i += 1) {
          const a = poly[i];
          const b = poly[(i + 1) % poly.length];
          area += a[0] * b[1] - b[0] * a[1];
        }
        return area / 2;
      }

      function fmt(value, digits = 4) {
        return Number(value.toFixed(digits)).toString();
      }

      function cssUrl(value) {
        return `url("${value}")`;
      }

      function borderShapePolygon(pointsForShape) {
        const body = pointsForShape.map(([x, y]) => `${fmt(x, 3)}% ${fmt(y, 3)}%`).join(",");
        return `polygon(${body})`;
      }

      function borderShapePlainPolygon(pointsForShape) {
        const body = pointsForShape.map(([x, y]) => `${fmt(x, 3)}% ${fmt(y, 3)}%`).join(",");
        return `polygon(${body})`;
      }

      function borderShapePath(pointsForShape) {
        const body = pointsForShape
          .map(([x, y], i) => `${i === 0 ? "M" : "L"} ${fmt(x / 100 * primitive, 3)} ${fmt(y / 100 * primitive, 3)}`)
          .join(" ");
        return `path("${body} Z")`;
      }

      function borderShapeShape(pointsForShape) {
        const first = pointsForShape[0];
        const rest = pointsForShape.slice(1)
          .map(([x, y]) => `line to ${fmt(x, 3)}% ${fmt(y, 3)}%`)
          .join(", ");
        return `shape(from ${fmt(first[0], 3)}% ${fmt(first[1], 3)}%, ${rest}, close)`;
      }

      function borderInnerShapeValue(inner) {
        switch (inner) {
          case "circle0center":
            return "circle(0 at 50% 50%)";
          case "ellipse0":
            return "ellipse(0 0)";
          case "ellipse0center":
            return "ellipse(0 0 at 50% 50%)";
          case "inset50":
            return "inset(50%)";
          case "inset100":
            return "inset(100%)";
          case "xywh0":
            return "xywh(0 0 0 0)";
          case "xywhcenter0":
            return "xywh(50% 50% 0 0)";
          case "rect0":
            return "rect(0 0 0 0)";
          case "polygon000":
            return "polygon(0 0, 0 0, 0 0)";
          case "polygoncenter":
            return "polygon(50% 50%, 50% 50%, 50% 50%)";
          case "pathempty":
            return 'path("M 0 0 Z")';
          case "pathpoint":
            return 'path("M 0 0 L 0 0 L 0 0 Z")';
          case "shapepoint":
            return "shape(from 0 0, line to 0 0, line to 0 0, close)";
          case "shapecenter":
            return "shape(from 50% 50%, line to 50% 50%, line to 50% 50%, close)";
          case "circle0":
          default:
            return "circle(0)";
        }
      }

      function borderOuterShapeValue(fn, pointsForShape) {
        switch (fn) {
          case "path":
            return borderShapePath(pointsForShape);
          case "shape":
            return borderShapeShape(pointsForShape);
          case "polygonplain":
            return borderShapePlainPolygon(pointsForShape);
          case "circle":
            return "circle(50% at 50% 50%)";
          case "ellipse":
            return "ellipse(50% 38% at 50% 50%)";
          case "xywh":
            return "xywh(0 0 100% 100% round 0px)";
          case "inset":
            return "inset(0 round 0px)";
          case "rect":
            return "rect(0 100% 100% 0)";
          case "polygon":
          default:
            return borderShapePolygon(pointsForShape);
        }
      }

      function borderShapeValue(fn, pointsForShape, inner = "circle0") {
        const outer = borderOuterShapeValue(fn, pointsForShape);
        return fn === "polygonplain" ? outer : `${outer} ${borderInnerShapeValue(inner)}`;
      }

      function cssClipPolygon(pointsForShape) {
        const body = pointsForShape.map(([x, y]) => `${fmt(x, 3)}% ${fmt(y, 3)}%`).join(",");
        return `polygon(${body})`;
      }

      function svgPoints(pointsForShape) {
        return pointsForShape
          .map(([x, y]) => `${fmt(x / 100 * primitive, 3)},${fmt(y / 100 * primitive, 3)}`)
          .join(" ");
      }

      function svgPath(pointsForShape) {
        return pointsForShape
          .map(([x, y], i) => `${i === 0 ? "M" : "L"} ${fmt(x / 100 * primitive, 3)} ${fmt(y / 100 * primitive, 3)}`)
          .join(" ") + " Z";
      }

      function gradientAngleFromVector(dx, dy) {
        const degrees = Math.atan2(dx, -dy) * 180 / Math.PI;
        return degrees < 0 ? degrees + 360 : degrees;
      }

      function halfPlaneGradientLayers(pointsForShape) {
        const area = signedArea(pointsForShape);
        return pointsForShape.map((a, i) => {
          const b = pointsForShape[(i + 1) % pointsForShape.length];
          const edgeX = b[0] - a[0];
          const edgeY = b[1] - a[1];
          const normalX = area >= 0 ? -edgeY : edgeY;
          const normalY = area >= 0 ? edgeX : -edgeX;
          const length = Math.hypot(normalX, normalY) || 1;
          const dx = normalX / length;
          const dy = normalY / length;
          const corners = [[0, 0], [100, 0], [100, 100], [0, 100]];
          const projections = corners.map(([x, y]) => x * dx + y * dy);
          const min = Math.min(...projections);
          const max = Math.max(...projections);
          const line = a[0] * dx + a[1] * dy;
          const stop = Math.max(0, Math.min(100, ((line - min) / Math.max(0.0001, max - min)) * 100));
          return `linear-gradient(${fmt(gradientAngleFromVector(dx, dy), 6)}deg, transparent ${fmt(stop, 4)}%, #000 ${fmt(stop, 4)}%)`;
        });
      }

      function makeAtlasUrl(pointsForShape, size) {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, size, size);
        ctx.fillStyle = "#7ad2ff";
        ctx.beginPath();
        pointsForShape.forEach(([x, y], i) => {
          const px = x / 100 * size;
          const py = y / 100 * size;
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        });
        ctx.closePath();
        ctx.fill();
        return new Promise((resolve) => {
          canvas.toBlob((blob) => {
            resolve(blob ? URL.createObjectURL(blob) : canvas.toDataURL("image/png"));
          }, "image/png");
        });
      }

      const borderShapeCss = borderShapeValue(borderFunction, points, borderInner);
      const support = {
        borderShape: CSS.supports("border-shape", borderShapeValue("polygon", points)),
        borderShapeFunction: CSS.supports("border-shape", borderShapeCss),
        borderFunctions: Object.fromEntries(borderFunctions.map((fn) => [fn, CSS.supports("border-shape", borderShapeValue(fn, points))])),
        borderInners: Object.fromEntries(borderInners.map((inner) => [inner, CSS.supports("border-shape", borderShapeValue("polygon", points, inner))])),
        clipPathPolygon: CSS.supports("clip-path", cssClipPolygon(points)),
        maskComposite: CSS.supports("mask-composite", "intersect"),
        webkitMaskComposite: CSS.supports("-webkit-mask-composite", "source-in"),
      };
      const bench = {
        ready: false,
        options: {
          strategy,
          count,
          primitive,
          target,
          borderFunction,
          borderInner,
          borderShapeSource,
          leafContain,
          leafWillChange,
          leafIsolation,
          borderStyle: borderStyleMode,
          svgMode,
          shape: shapeId,
          motion,
          jitter,
        },
        support,
        mountMs: 0,
        styleBytes: 0,
        sharedStyleBytes: 0,
        samples: [],
      };
      window.__maskPolyBench = bench;

      const maskLayers = halfPlaneGradientLayers(points).join(",");
      const maskComposite = new Array(Math.max(1, points.length - 1)).fill("intersect").join(",");
      const webkitMaskComposite = new Array(Math.max(1, points.length - 1)).fill("source-in").join(",");
      const clipPath = cssClipPolygon(points);
      const atlasUrl = await makeAtlasUrl(points, primitive);
      const atlasBackground = `${cssUrl(atlasUrl)} 0 0 / ${primitive}px ${primitive}px no-repeat`;
      const scale = target / primitive;
      const borderScale = target / primitive;
      const palette = ["#7ad2ff", "#f07080", "#f4c95d", "#9ee493", "#b894ff", "#f39c6b"];
      const svgNS = "http://www.w3.org/2000/svg";

      if (strategy === "border" && borderShapeSource === "class") {
        const style = document.createElement("style");
        style.textContent = `.bench-border-shape-shared{border-shape:${borderShapeCss}}`;
        bench.sharedStyleBytes = style.textContent.length;
        bench.styleBytes = bench.sharedStyleBytes;
        document.head.appendChild(style);
      }

      function pseudoRandom(index) {
        const x = Math.sin(index * 12.9898 + 78.233) * 43758.5453;
        return x - Math.floor(x);
      }

      function transformFor(index, cols, rows, leafScale) {
        const col = index % cols;
        const row = Math.floor(index / cols);
        const xJitter = (pseudoRandom(index) - 0.5) * target * jitter;
        const yJitter = (pseudoRandom(index + 19) - 0.5) * target * jitter;
        const zJitter = (pseudoRandom(index + 41) - 0.5) * 180;
        const x = (col - cols / 2) * (target * 0.56) + xJitter;
        const y = (row - rows / 2) * (target * 0.56) + yJitter;
        const z = zJitter;
        const rx = -18 + pseudoRandom(index + 5) * 36;
        const ry = -28 + pseudoRandom(index + 9) * 56;
        const rz = pseudoRandom(index + 13) * 360;
        return `translate3d(${fmt(x, 3)}px,${fmt(y, 3)}px,${fmt(z, 3)}px) rotateX(${fmt(rx, 3)}deg) rotateY(${fmt(ry, 3)}deg) rotateZ(${fmt(rz, 3)}deg) scale(${fmt(leafScale, 6)})`;
      }

      function setLeafClass(el, className) {
        el.setAttribute("class", className);
      }

      function applyCommonLeafToggles(el) {
        if (leafContain !== "none") el.style.contain = leafContain;
        if (leafWillChange === "auto") el.style.willChange = "auto";
        if (leafIsolation !== "auto") el.style.isolation = leafIsolation;
      }

      function applyStrategy(el, index) {
        el.style.setProperty("--paint", palette[index % palette.length]);
        applyCommonLeafToggles(el);
        if (strategy === "border") {
          const classes = ["leaf", "border"];
          if (borderShapeSource === "class") classes.push("bench-border-shape-shared");
          if (borderShapeSource === "var") classes.push("bench-border-shape-var");
          setLeafClass(el, classes.join(" "));
          if (primitive !== 16) {
            el.style.width = `${primitive}px`;
            el.style.height = `${primitive}px`;
          }
          if (borderStyleMode !== "none") el.style.borderStyle = borderStyleMode;
          if (borderShapeSource === "var") el.style.setProperty("--border-shape", borderShapeCss);
          else if (borderShapeSource !== "class") el.style.setProperty("border-shape", borderShapeCss);
          return;
        }
        if (strategy === "solid") {
          setLeafClass(el, "leaf solid");
          el.style.width = `${primitive}px`;
          el.style.height = `${primitive}px`;
          return;
        }
        if (strategy === "atlas") {
          setLeafClass(el, "leaf atlas");
          el.style.width = `${primitive}px`;
          el.style.height = `${primitive}px`;
          el.style.background = atlasBackground;
          return;
        }
        if (strategy === "clip") {
          setLeafClass(el, "leaf clip");
          el.style.width = `${primitive}px`;
          el.style.height = `${primitive}px`;
          el.style.clipPath = clipPath;
          return;
        }
        if (strategy === "svg") {
          setLeafClass(el, "leaf svg");
          el.setAttribute("width", String(primitive));
          el.setAttribute("height", String(primitive));
          el.setAttribute("viewBox", `0 0 ${primitive} ${primitive}`);
          const shapeEl = document.createElementNS(svgNS, svgMode === "path" ? "path" : "polygon");
          if (shapeEl.tagName.toLowerCase() === "path") {
            shapeEl.setAttribute("d", svgPath(points));
          } else {
            shapeEl.setAttribute("points", svgPoints(points));
          }
          el.appendChild(shapeEl);
          return;
        }
        setLeafClass(el, "leaf mask");
        el.style.width = `${primitive}px`;
        el.style.height = `${primitive}px`;
        el.style.maskImage = maskLayers;
        el.style.maskComposite = maskComposite;
        el.style.webkitMaskImage = maskLayers;
        el.style.webkitMaskComposite = webkitMaskComposite;
      }

      function mount() {
        world.dataset.motion = motion === "static" ? "static" : "orbit";
        const cols = Math.ceil(Math.sqrt(count * 1.55));
        const rows = Math.ceil(count / cols);
        const fragment = document.createDocumentFragment();
        const leafScale = strategy === "border" ? borderScale : scale;
        const tag = strategy === "border" ? "i" : strategy === "solid" ? "b" : strategy === "atlas" ? "s" : strategy === "svg" ? "svg" : "i";
        const start = performance.now();
        for (let i = 0; i < count; i += 1) {
          const el = strategy === "svg" ? document.createElementNS(svgNS, tag) : document.createElement(tag);
          applyStrategy(el, i);
          el.style.transform = transformFor(i, cols, rows, leafScale);
          fragment.appendChild(el);
          bench.styleBytes += (el.getAttribute("style") ?? "").length;
        }
        world.appendChild(fragment);
        bench.mountMs = performance.now() - start;
        bench.ready = true;
        hud.textContent = [
          `strategy=${strategy} svgMode=${svgMode} borderFunction=${borderFunction} borderInner=${borderInner} borderShapeSource=${borderShapeSource} contain=${leafContain} will=${leafWillChange} isolation=${leafIsolation} borderStyle=${borderStyleMode} count=${count} primitive=${primitive}px shape=${shapeId}`,
          `borderShape=${support.borderShape ? "yes" : "no"} function=${support.borderShapeFunction ? "yes" : "no"} clipPath=${support.clipPathPolygon ? "yes" : "no"} maskComposite=${support.maskComposite ? "yes" : "no"} webkitMaskComposite=${support.webkitMaskComposite ? "yes" : "no"}`,
          `mount=${bench.mountMs.toFixed(2)}ms style=${bench.styleBytes}B`,
        ].join("\n");
      }

      function startSampler() {
        let last = performance.now();
        const tick = (now) => {
          bench.samples.push({ t: now, dt: now - last });
          if (bench.samples.length > 3600) bench.samples.splice(0, bench.samples.length - 3600);
          last = now;
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      }

      window.runMaskPolygonBench = async ({ warmupMs = 1000, sampleMs = 2500 } = {}) => {
        await new Promise((resolve) => setTimeout(resolve, warmupMs));
        const from = bench.samples.length;
        await new Promise((resolve) => setTimeout(resolve, sampleMs));
        return {
          options: bench.options,
          support: bench.support,
          mountMs: bench.mountMs,
          styleBytes: bench.styleBytes,
          samples: bench.samples.slice(from),
        };
      };

      mount();
      startSampler();
    })();
  </script>
</body>
</html>
