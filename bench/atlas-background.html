<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>polycss atlas background bench</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0e1014;
      }
      #bench-target {
        position: relative;
        width: 100%;
        height: 100%;
        contain: layout style paint;
      }
      .polycss-mesh {
        position: absolute;
        top: 0;
        left: 0;
      }
      s {
        position: absolute;
        display: block;
        width: var(--polycss-atlas-size, 128px);
        height: var(--polycss-atlas-size, 128px);
        background-repeat: no-repeat;
        transform-origin: 0 0;
      }
    </style>
  </head>
  <body>
    <div id="bench-target"></div>
    <script type="module" src="/.generated/polycss-atlas-background.js"></script>
  </body>
</html>
