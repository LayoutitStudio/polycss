<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>polycss parity trio — vanilla / React / Vue</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #111; color: #cde; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: flex; flex-direction: column; }
    #controls { padding: 8px 12px; background: #1a1d22; border-bottom: 1px solid #2a2d33; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; font-size: 12px; }
    #controls label { display: flex; align-items: center; gap: 4px; }
    #controls select, #controls input[type=number] { background: #0e1116; color: #cde; border: 1px solid #2a2d33; padding: 3px 6px; border-radius: 3px; }
    #grid { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #2a2d33; min-height: 0; }
    .panel { display: flex; flex-direction: column; background: #111; min-width: 0; min-height: 0; }
    .panel header { padding: 6px 10px; background: #1a1d22; font-size: 11px; color: #88c; text-transform: uppercase; letter-spacing: 1px; }
    .panel iframe { flex: 1; width: 100%; border: 0; background: #0a0c10; }
  </style>
</head>
<body>
  <div id="controls">
    <label>mesh
      <select id="mesh">
        <option value="castle">castle</option>
        <option value="teapot">teapot</option>
        <option value="cottage">cottage</option>
        <option value="coliseum">coliseum</option>
        <option value="apple">apple</option>
        <option value="ducky">ducky</option>
        <option value="rock1">rock1</option>
      </select>
    </label>
    <label>mode
      <select id="mode">
        <option value="baked">baked</option>
        <option value="dynamic">dynamic</option>
      </select>
    </label>
    <label>motion
      <select id="motion">
        <option value="none">none</option>
        <option value="light">light</option>
        <option value="rot">rot</option>
      </select>
    </label>
    <label>az <input id="az" type="number" value="60" step="10" style="width:60px"></label>
    <label>el <input id="el" type="number" value="45" step="5" style="width:60px"></label>
    <label>zoom <input id="zoom" type="number" value="4" step="0.5" style="width:60px"></label>
    <label><input id="cast" type="checkbox" checked> castShadow</label>
    <label><input id="floor" type="checkbox" checked> floor receiver</label>
    <button id="reload" style="background:#3a3d43;color:#cde;border:1px solid #4a4d53;padding:4px 12px;border-radius:3px;cursor:pointer">reload all</button>
  </div>
  <div id="grid">
    <div class="panel"><header>vanilla</header><iframe id="vanilla-iframe"></iframe></div>
    <div class="panel"><header>react</header><iframe id="react-iframe"></iframe></div>
    <div class="panel"><header>vue</header><iframe id="vue-iframe"></iframe></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    function get(id, fallback) { return params.get(id) ?? fallback; }
    document.getElementById("mesh").value = get("mesh", "castle");
    document.getElementById("mode").value = get("mode", "baked");
    document.getElementById("motion").value = get("motion", "none");
    document.getElementById("az").value = get("az", "60");
    document.getElementById("el").value = get("el", "45");
    document.getElementById("zoom").value = get("zoom", "4");
    document.getElementById("cast").checked = get("cast", "1") !== "0";
    document.getElementById("floor").checked = get("floor", "1") !== "0";

    function build(qs) {
      return {
        vanilla: `perf-vanilla.html?${qs}`,
        react:   `perf-react.html?${qs}`,
        vue:     `perf-vue.html?${qs}`,
      };
    }

    function refresh() {
      const qs = new URLSearchParams({
        mesh:   document.getElementById("mesh").value,
        mode:   document.getElementById("mode").value,
        motion: document.getElementById("motion").value,
        az:     document.getElementById("az").value,
        el:     document.getElementById("el").value,
        zoom:   document.getElementById("zoom").value,
        cast:   document.getElementById("cast").checked ? "1" : "0",
        floor:  document.getElementById("floor").checked ? "1" : "0",
        nohud:  "1",
      }).toString();
      const urls = build(qs);
      document.getElementById("vanilla-iframe").src = urls.vanilla;
      document.getElementById("react-iframe").src   = urls.react;
      document.getElementById("vue-iframe").src     = urls.vue;
      // Update the parent URL so the config is shareable + survives reload.
      const parentQs = new URLSearchParams(qs); parentQs.delete("nohud");
      history.replaceState({}, "", `parity-trio.html?${parentQs}`);
    }

    document.getElementById("reload").addEventListener("click", refresh);
    for (const id of ["mesh", "mode", "motion", "az", "el", "zoom", "cast", "floor"]) {
      document.getElementById(id).addEventListener("change", refresh);
    }
    refresh();
  </script>
</body>
</html>
