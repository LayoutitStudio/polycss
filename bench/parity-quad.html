<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>polycss parity quad — vanilla / React / Vue / HTML</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: #eef2f6; font-family: ui-sans-serif, system-ui, sans-serif; color: #1e293b; }
    /* 2x2 stage grid + 360px right panel — same layout as shadow-oracle. */
    body {
      display: grid;
      grid-template-columns: 1fr 1fr 360px;
      grid-template-rows: 1fr 1fr;
      grid-template-areas:
        "vanilla react   panel"
        "vue     html-ce panel";
      height: 100vh; overflow: hidden;
    }
    .stage { position: relative; overflow: hidden; border-right: 1px solid #cbd5e1; border-bottom: 1px solid #cbd5e1; background: #0a0c10; }
    .stage.vanilla { grid-area: vanilla; }
    .stage.react   { grid-area: react; }
    .stage.vue     { grid-area: vue; }
    .stage.html-ce { grid-area: html-ce; }
    .stage > h3 { position: absolute; top: 8px; left: 12px; margin: 0; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #f87171; z-index: 10; pointer-events: none; }
    .stage > .host { position: absolute; inset: 0; }
    /* Shadows-only mode — hide mesh leaves so only the shadow SVGs render. */
    .stage > .host.shadows-only .polycss-mesh { visibility: hidden; }
    #panel { grid-area: panel; padding: 12px; background: #f8fafc; overflow-y: auto; border-left: 1px solid #cbd5e1; font-size: 12px; }
    #panel .sec { margin: 14px 0 6px; font-weight: 600; color: #0f172a; font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; }
    #panel .row { display: grid; grid-template-columns: 70px 1fr 60px; gap: 6px; align-items: center; margin: 3px 0; }
    #panel .row > label { color: #475569; }
    #panel .row > .val { text-align: right; font-variant-numeric: tabular-nums; }
    #panel .row > input[type=range] { width: 100%; }
    #panel .row > input[type=number], #panel .row > select { background: #fff; color: #1e293b; border: 1px solid #cbd5e1; padding: 3px 6px; border-radius: 3px; font: inherit; }
    #panel .row > input[type=checkbox] { justify-self: start; }
    #panel .row > input[type=color] { height: 22px; padding: 0; border: 1px solid #cbd5e1; background: #fff; }
    #panel button { background: #3b82f6; color: #fff; border: 0; padding: 5px 12px; border-radius: 3px; cursor: pointer; font: inherit; }
    #panel button:hover { background: #2563eb; }
    #panel .info { font-size: 11px; color: #64748b; line-height: 1.4; margin: 8px 0 12px; padding: 8px; background: #fff; border: 1px solid #e2e8f0; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="stage vanilla"><h3>vanilla</h3><div class="host" id="vanilla-host"></div></div>
  <div class="stage react"><h3>react</h3><div class="host" id="react-host"></div></div>
  <div class="stage vue"><h3>vue</h3><div class="host" id="vue-host"></div></div>
  <div class="stage html-ce"><h3>html (custom elements)</h3><div class="host" id="html-host"></div></div>
  <div id="panel"></div>

  <script type="module">
    // ══════════════════════════════════════════════════════════════════════
    //  Mounts the same PolyCSS scene four ways (vanilla / React / Vue / HTML
    //  custom elements) into four host divs in this page, all driven by ONE
    //  state object via direct API calls. Same pattern shadow-oracle and
    //  three-parity use. No iframes, no postMessage. Slider drag mutates S
    //  then calls update(), which fans out: vanilla via setOptions /
    //  setTransform / applyCamera, React + Vue via re-render, HTML via
    //  attribute writes (with imperative fallbacks for surfaces the element
    //  layer doesn't expose).
    // ══════════════════════════════════════════════════════════════════════

    import {
      createPolyCamera, createPolyScene, createPolyOrbitControls, loadMesh,
    } from "./.generated/polycss.js";
    import { buildFloorPolygons } from "./perf-shared.mjs";
    import "./.generated/polycss-elements.js";
    import { mount as mountReact } from "./.generated/polycss-parity-quad-react.js";
    import { mount as mountVue } from "./.generated/polycss-parity-quad-vue.js";

    // ── Mesh presets (URL → loadMesh args) ─────────────────────────────────
    const PRESETS = {
      castle:   { url: "/gallery/obj/castle.obj",   objOptions: { targetSize: 60 },                                      rotX: 65, rotY: 45, zoom: 4 },
      teapot:   { url: "/gallery/obj/teapot.obj",   objOptions: { targetSize: 60, defaultColor: "#a3a3a3" },              rotX: 65, rotY: 45, zoom: 4 },
      cottage:  { url: "/gallery/obj/cottage.obj",  objOptions: { targetSize: 60 }, mtlUrl: "/gallery/obj/cottage.mtl",   rotX: 65, rotY: 45, zoom: 4 },
      coliseum: { url: "/gallery/obj/coliseum.obj", objOptions: { targetSize: 80, palette: ["#c9a876", "#a78760", "#8b6f47", "#6b5538"] }, rotX: 65, rotY: 45, zoom: 4 },
      apple:    { url: "/gallery/glb/apple.glb",    objOptions: { targetSize: 60 },                                       rotX: 74.4, rotY: 301.6, zoom: 4 },
      ducky:    { url: "/gallery/glb/poly-pizza/ducky.glb", objOptions: { targetSize: 60 },                               rotX: 65, rotY: 45, zoom: 4 },
      rock1:    { url: "/gallery/obj/rock1.obj",    objOptions: { targetSize: 40, defaultColor: "#8b6f47", excludeObjects: ["Plane"] }, mtlUrl: "/gallery/obj/rock1.mtl", rotX: 65, rotY: 45, zoom: 4 },
      "mecha-golem": { url: "/gallery/vox/mecha-golem.vox", objOptions: {}, rotX: 65, rotY: 45, zoom: 4 },
    };

    // ── Single source of truth for everything the four scenes render ──────
    const Q = new URLSearchParams(location.search);
    const qn = (k, d) => { const n = parseFloat(Q.get(k)); return Number.isFinite(n) ? n : d; };
    const qs = (k, d) => Q.get(k) ?? d;
    const meshId = qs("mesh", "castle");
    const preset = PRESETS[meshId] ?? PRESETS.castle;
    // Defaults mirror shadow-oracle so shadows are immediately visible:
    // angled light (dx=1, dy=0.5, dz=1), full-opacity shadow, ambient 0.3.
    const S = {
      mesh: meshId,
      textureLighting: qs("mode", "baked"),
      castShadow:      qs("cs", "1") !== "0",
      floorVisible:    qs("fv", "1") !== "0",
      floorReceives:   qs("fr", "1") !== "0",
      selfShadow:      qs("ss", "1") !== "0",
      shadowsOnly:     qs("sx", "0") === "1",
      autoCenter:      qs("ax", "1") !== "0",
      obj: { x: qn("ox", 0), y: qn("oy", 0), z: qn("oz", 0), scale: qn("os", 1), rx: qn("orx", 0), ry: qn("ory", 0), rz: qn("orz", 0) },
      dir: { x: qn("dx", 1), y: qn("dy", 0.5), z: qn("dz", 1), intensity: qn("di", 1), color: qs("dc", "#ffffff") },
      amb: { intensity: qn("ai", 0.3), color: qs("ac", "#ffffff") },
      shadow: { opacity: qn("so", 1.0) },
      cam: { rotX: qn("rotX", preset.rotX), rotY: qn("rotY", preset.rotY), zoom: qn("zoom", preset.zoom) },
    };
    const floorPolygons = buildFloorPolygons();

    // ── Build the state object the renderers' update() helpers take ───────
    function buildRendererState(parseResult) {
      return {
        textureLighting: S.textureLighting,
        polygons: parseResult.polygons,
        voxelSource: parseResult.voxelSource,
        castShadow: S.castShadow,
        selfShadow: S.selfShadow,
        floorVisible: S.floorVisible,
        floorReceives: S.floorReceives,
        autoCenter: S.autoCenter,
        floorPolygons,
        obj: { position: [S.obj.x, S.obj.y, S.obj.z], scale: S.obj.scale, rotation: [S.obj.rx, S.obj.ry, S.obj.rz] },
        dir: { direction: [S.dir.x, S.dir.y, S.dir.z], intensity: S.dir.intensity, color: S.dir.color },
        amb: { intensity: S.amb.intensity, color: S.amb.color },
        shadow: { opacity: S.shadow.opacity },
        cam: { rotX: S.cam.rotX, rotY: S.cam.rotY, zoom: S.cam.zoom },
      };
    }

    // ══════════════════════════════════════════════════════════════════════
    //  Mounting — load the mesh once, then stand up all four renderers
    //  against the same parseResult.
    // ══════════════════════════════════════════════════════════════════════
    const parseResult = await loadMesh(preset.url, {
      ...(preset.mtlUrl ? { mtlUrl: preset.mtlUrl } : {}),
      objOptions: preset.options ?? preset.objOptions ?? {},
    });

    // ── Vanilla (createPolyScene + scene.add) ──────────────────────────────
    const vanillaHost = document.getElementById("vanilla-host");
    const vanillaCamera = createPolyCamera({ rotX: S.cam.rotX, rotY: S.cam.rotY, zoom: S.cam.zoom });
    const vanillaScene = createPolyScene(vanillaHost, {
      camera: vanillaCamera,
      directionalLight: { direction: [S.dir.x, S.dir.y, S.dir.z], color: S.dir.color, intensity: S.dir.intensity },
      ambientLight: { color: S.amb.color, intensity: S.amb.intensity },
      shadow: { opacity: S.shadow.opacity },
      textureLighting: S.textureLighting,
      autoCenter: S.autoCenter,
    });
    const vanillaOrbit = createPolyOrbitControls(vanillaScene, { drag: true, wheel: true });
    const vanillaMesh = vanillaScene.add(parseResult, {
      castShadow: S.castShadow,
      receiveShadow: S.selfShadow,
      position: [S.obj.x, S.obj.y, S.obj.z],
      scale: S.obj.scale,
      rotation: [S.obj.rx, S.obj.ry, S.obj.rz],
    });
    const vanillaFloor = S.floorVisible
      ? vanillaScene.add({ polygons: floorPolygons }, { receiveShadow: S.floorReceives })
      : null;
    vanillaOrbit.addEventListener("change", (e) => {
      // User dragged the vanilla pane — push to S + propagate to the others.
      S.cam.rotX = e.snapshot.rotX;
      S.cam.rotY = e.snapshot.rotY;
      S.cam.zoom = e.snapshot.zoom;
      camSlidersRefresh();
      updateAll();
    });

    // ── HTML custom elements (<poly-scene> + <poly-mesh>) ──────────────────
    const htmlHost = document.getElementById("html-host");
    const htmlScene = document.createElement("poly-scene");
    htmlScene.style.cssText = "position:absolute;inset:0;";
    htmlScene.setAttribute("rot-x", String(S.cam.rotX));
    htmlScene.setAttribute("rot-y", String(S.cam.rotY));
    htmlScene.setAttribute("zoom", String(S.cam.zoom));
    htmlScene.setAttribute("texture-lighting", S.textureLighting);
    htmlScene.setAttribute("auto-center", "");
    htmlScene.setAttribute("directional-direction", `${S.dir.x},${S.dir.y},${S.dir.z}`);
    htmlScene.setAttribute("directional-color", S.dir.color);
    htmlScene.setAttribute("directional-intensity", String(S.dir.intensity));
    htmlScene.setAttribute("ambient-color", S.amb.color);
    htmlScene.setAttribute("ambient-intensity", String(S.amb.intensity));
    const htmlOrbit = document.createElement("poly-orbit-controls");
    htmlOrbit.setAttribute("drag", "");
    htmlOrbit.setAttribute("wheel", "");
    htmlScene.appendChild(htmlOrbit);
    const htmlMesh = document.createElement("poly-mesh");
    htmlMesh.setAttribute("src", preset.url);
    if (preset.mtlUrl) htmlMesh.setAttribute("mtl", preset.mtlUrl);
    if ((preset.options ?? preset.objOptions)?.targetSize) htmlMesh.setAttribute("target-size", String((preset.options ?? preset.objOptions).targetSize));
    if ((preset.options ?? preset.objOptions)?.defaultColor) htmlMesh.setAttribute("default-color", (preset.options ?? preset.objOptions).defaultColor);
    if ((preset.options ?? preset.objOptions)?.palette) htmlMesh.setAttribute("palette", (preset.options ?? preset.objOptions).palette.join(","));
    if ((preset.options ?? preset.objOptions)?.excludeObjects) htmlMesh.setAttribute("exclude-objects", (preset.options ?? preset.objOptions).excludeObjects.join(","));
    htmlMesh.setAttribute("position", `${S.obj.x},${S.obj.y},${S.obj.z}`);
    htmlMesh.setAttribute("scale", String(S.obj.scale));
    htmlMesh.setAttribute("rotation", `${S.obj.rx},${S.obj.ry},${S.obj.rz}`);
    if (S.castShadow) htmlMesh.setAttribute("cast-shadow", "");
    htmlScene.appendChild(htmlMesh);
    htmlHost.appendChild(htmlScene);
    let htmlFloorMesh = null;
    function ensureHtmlFloor() {
      const handle = htmlScene.getScene();
      if (!handle) return;
      if (S.floorVisible && !htmlFloorMesh) {
        htmlFloorMesh = handle.add({ polygons: floorPolygons }, { receiveShadow: S.floorReceives });
      } else if (!S.floorVisible && htmlFloorMesh) {
        htmlFloorMesh.remove();
        htmlFloorMesh = null;
      } else if (htmlFloorMesh) {
        htmlFloorMesh.setTransform({ receiveShadow: S.floorReceives });
      }
    }
    htmlMesh.addEventListener("polycss:loaded", () => { ensureHtmlFloor(); });

    // ── React (createRoot + small App component, see parityQuadReact.tsx) ──
    const reactHost = document.getElementById("react-host");
    const reactMount = mountReact(reactHost, buildRendererState(parseResult), (snap) => {
      S.cam.rotX = snap.rotX;
      S.cam.rotY = snap.rotY;
      S.cam.zoom = snap.zoom;
      camSlidersRefresh();
      updateAll();
    });

    // ── Vue (createApp + small render function, see parityQuadVue.ts) ──────
    const vueHost = document.getElementById("vue-host");
    const vueMount = mountVue(vueHost, buildRendererState(parseResult), (snap) => {
      S.cam.rotX = snap.rotX;
      S.cam.rotY = snap.rotY;
      S.cam.zoom = snap.zoom;
      camSlidersRefresh();
      updateAll();
    });

    // ══════════════════════════════════════════════════════════════════════
    //  Updater — single function fans S into all four renderers.
    // ══════════════════════════════════════════════════════════════════════
    function updateAll() {
      // Vanilla: imperative setOptions / setTransform / applyCamera.
      vanillaCamera.update({ rotX: S.cam.rotX, rotY: S.cam.rotY, zoom: S.cam.zoom });
      vanillaScene.applyCamera();
      vanillaScene.setOptions({
        directionalLight: { direction: [S.dir.x, S.dir.y, S.dir.z], color: S.dir.color, intensity: S.dir.intensity },
        ambientLight: { color: S.amb.color, intensity: S.amb.intensity },
        shadow: { opacity: S.shadow.opacity },
        textureLighting: S.textureLighting,
        autoCenter: S.autoCenter,
      });
      vanillaMesh.setTransform({
        position: [S.obj.x, S.obj.y, S.obj.z],
        scale: S.obj.scale,
        rotation: [S.obj.rx, S.obj.ry, S.obj.rz],
        castShadow: S.castShadow,
        receiveShadow: S.selfShadow,
      });

      // HTML elements: declarative attribute writes for everything <poly-
      // scene> / <poly-mesh> observes. Shadow opacity has no attribute today,
      // so it goes through the imperative scene handle.
      htmlScene.setAttribute("rot-x", String(S.cam.rotX));
      htmlScene.setAttribute("rot-y", String(S.cam.rotY));
      htmlScene.setAttribute("zoom", String(S.cam.zoom));
      htmlScene.setAttribute("texture-lighting", S.textureLighting);
      htmlScene.setAttribute("directional-direction", `${S.dir.x},${S.dir.y},${S.dir.z}`);
      htmlScene.setAttribute("directional-color", S.dir.color);
      htmlScene.setAttribute("directional-intensity", String(S.dir.intensity));
      htmlScene.setAttribute("ambient-color", S.amb.color);
      htmlScene.setAttribute("ambient-intensity", String(S.amb.intensity));
      htmlMesh.setAttribute("position", `${S.obj.x},${S.obj.y},${S.obj.z}`);
      htmlMesh.setAttribute("scale", String(S.obj.scale));
      htmlMesh.setAttribute("rotation", `${S.obj.rx},${S.obj.ry},${S.obj.rz}`);
      if (S.castShadow) htmlMesh.setAttribute("cast-shadow", "");
      else htmlMesh.removeAttribute("cast-shadow");
      const htmlSceneHandle = htmlScene.getScene();
      if (htmlSceneHandle) htmlSceneHandle.setOptions({ shadow: { opacity: S.shadow.opacity } });
      ensureHtmlFloor();

      // React + Vue: rebuild the renderer state and let each framework's
      // re-render propagate the values into PolyScene / PolyMesh props.
      const rs = buildRendererState(parseResult);
      reactMount.update(rs);
      vueMount.update(rs);

      // Vanilla floor: add / remove based on toggle. Floor visible can be on
      // while floor receives shadow can be off — those are independent knobs.
      if (S.floorVisible && !vanillaFloorRef.current) {
        vanillaFloorRef.current = vanillaScene.add({ polygons: floorPolygons }, { receiveShadow: S.floorReceives });
      } else if (!S.floorVisible && vanillaFloorRef.current) {
        vanillaFloorRef.current.remove();
        vanillaFloorRef.current = null;
      } else if (vanillaFloorRef.current) {
        vanillaFloorRef.current.setTransform({ receiveShadow: S.floorReceives });
      }

      // Shadows-only: hide .polycss-mesh wrappers via a CSS class so only
      // the shadow SVGs (which live as .polycss-shadow siblings) remain.
      for (const host of [vanillaHost, document.getElementById("react-host"), document.getElementById("vue-host"), htmlHost]) {
        host?.classList.toggle("shadows-only", S.shadowsOnly);
      }

      writeUrl();
    }
    const vanillaFloorRef = { current: vanillaFloor };

    function writeUrl() {
      const qs = new URLSearchParams();
      qs.set("mesh", S.mesh);
      qs.set("mode", S.textureLighting);
      qs.set("cs", S.castShadow ? "1" : "0");
      qs.set("ss", S.selfShadow ? "1" : "0");
      qs.set("fv", S.floorVisible ? "1" : "0");
      qs.set("fr", S.floorReceives ? "1" : "0");
      qs.set("ax", S.autoCenter ? "1" : "0");
      if (S.shadowsOnly) qs.set("sx", "1");
      qs.set("rotX", String(S.cam.rotX));
      qs.set("rotY", String(S.cam.rotY));
      qs.set("zoom", String(S.cam.zoom));
      qs.set("ox", String(S.obj.x)); qs.set("oy", String(S.obj.y)); qs.set("oz", String(S.obj.z));
      qs.set("os", String(S.obj.scale));
      qs.set("orx", String(S.obj.rx)); qs.set("ory", String(S.obj.ry)); qs.set("orz", String(S.obj.rz));
      qs.set("dx", String(S.dir.x)); qs.set("dy", String(S.dir.y)); qs.set("dz", String(S.dir.z));
      qs.set("di", String(S.dir.intensity)); qs.set("dc", S.dir.color);
      qs.set("ai", String(S.amb.intensity)); qs.set("ac", S.amb.color);
      qs.set("so", String(S.shadow.opacity));
      history.replaceState({}, "", `parity-quad.html?${qs}`);
    }

    // ══════════════════════════════════════════════════════════════════════
    //  Sidebar — sliders + dropdowns + color pickers.
    // ══════════════════════════════════════════════════════════════════════
    const panel = document.getElementById("panel");
    const camSliders = {};
    function camSlidersRefresh() {
      ["rotX", "rotY", "zoom"].forEach((k) => {
        const r = camSliders[k];
        if (!r) return;
        r.input.value = String(S.cam[k]);
        r.val.textContent = r.fmt(S.cam[k]);
      });
    }

    function addSection(title) {
      const d = document.createElement("div"); d.className = "sec"; d.textContent = title; panel.appendChild(d);
    }
    function addSelectRow(labelText, options, value, onChange) {
      const row = document.createElement("div"); row.className = "row";
      const lab = document.createElement("label"); lab.textContent = labelText; row.appendChild(lab);
      const sel = document.createElement("select"); sel.style.gridColumn = "2 / span 2";
      for (const opt of options) {
        const o = document.createElement("option"); o.value = String(opt); o.textContent = String(opt);
        if (String(value) === String(opt)) o.selected = true;
        sel.appendChild(o);
      }
      sel.addEventListener("change", () => onChange(sel.value));
      row.appendChild(sel); panel.appendChild(row);
    }
    function addCheckboxRow(labelText, checked, onChange) {
      const row = document.createElement("div"); row.className = "row";
      const lab = document.createElement("label"); lab.textContent = labelText; row.appendChild(lab);
      const inp = document.createElement("input"); inp.type = "checkbox"; inp.checked = checked;
      inp.addEventListener("change", () => onChange(inp.checked));
      row.appendChild(inp); panel.appendChild(row);
    }
    function addRangeRow(labelText, { min, max, step, value, fmt }, onChange, camKey) {
      const row = document.createElement("div"); row.className = "row";
      const lab = document.createElement("label"); lab.textContent = labelText; row.appendChild(lab);
      const inp = document.createElement("input"); inp.type = "range";
      inp.min = String(min); inp.max = String(max); inp.step = String(step); inp.value = String(value);
      const val = document.createElement("span"); val.className = "val"; val.textContent = fmt(Number(value));
      inp.addEventListener("input", () => {
        const n = parseFloat(inp.value);
        val.textContent = fmt(n);
        onChange(n);
      });
      row.appendChild(inp); row.appendChild(val); panel.appendChild(row);
      if (camKey) camSliders[camKey] = { input: inp, val, fmt };
    }
    function addColorRow(labelText, value, onChange) {
      const row = document.createElement("div"); row.className = "row";
      const lab = document.createElement("label"); lab.textContent = labelText; row.appendChild(lab);
      const inp = document.createElement("input"); inp.type = "color"; inp.value = value;
      inp.style.gridColumn = "2 / span 2";
      inp.addEventListener("input", () => onChange(inp.value));
      row.appendChild(inp); panel.appendChild(row);
    }

    addSection("Scene");
    addSelectRow("mesh", Object.keys(PRESETS), S.mesh, (v) => {
      Q.set("mesh", v);
      location.search = Q.toString();
    });
    addSelectRow("lighting", ["baked", "dynamic"], S.textureLighting, (v) => { S.textureLighting = v; updateAll(); });
    addCheckboxRow("autoCenter", S.autoCenter, (v) => { S.autoCenter = v; updateAll(); });

    addSection("Shadow flags");
    addCheckboxRow("castShadow", S.castShadow, (v) => { S.castShadow = v; updateAll(); });
    addCheckboxRow("selfShadow", S.selfShadow, (v) => { S.selfShadow = v; updateAll(); });
    addCheckboxRow("floor visible", S.floorVisible, (v) => { S.floorVisible = v; updateAll(); });
    addCheckboxRow("floor receives", S.floorReceives, (v) => { S.floorReceives = v; updateAll(); });
    addCheckboxRow("shadows only", S.shadowsOnly, (v) => { S.shadowsOnly = v; updateAll(); });

    addSection("Object");
    const objField = (f, opts) => addRangeRow(f, { ...opts, value: S.obj[f] }, (n) => { S.obj[f] = n; updateAll(); });
    objField("x", { min: -10, max: 10, step: 0.1, fmt: (v) => v.toFixed(2) });
    objField("y", { min: -10, max: 10, step: 0.1, fmt: (v) => v.toFixed(2) });
    objField("z", { min: -10, max: 10, step: 0.1, fmt: (v) => v.toFixed(2) });
    objField("scale", { min: 0.01, max: 6, step: 0.01, fmt: (v) => v.toFixed(2) });
    objField("rx", { min: -180, max: 180, step: 1, fmt: (v) => v.toFixed(0) + "°" });
    objField("ry", { min: -180, max: 180, step: 1, fmt: (v) => v.toFixed(0) + "°" });
    objField("rz", { min: -180, max: 180, step: 1, fmt: (v) => v.toFixed(0) + "°" });

    addSection("Directional light");
    const dirField = (f, opts) => addRangeRow(f, { ...opts, value: S.dir[f] }, (n) => { S.dir[f] = n; updateAll(); });
    dirField("x", { min: -2, max: 2, step: 0.05, fmt: (v) => v.toFixed(2) });
    dirField("y", { min: -2, max: 2, step: 0.05, fmt: (v) => v.toFixed(2) });
    dirField("z", { min: -2, max: 2, step: 0.05, fmt: (v) => v.toFixed(2) });
    dirField("intensity", { min: 0, max: 3, step: 0.05, fmt: (v) => v.toFixed(2) });
    addColorRow("color", S.dir.color, (c) => { S.dir.color = c; updateAll(); });

    addSection("Ambient");
    addRangeRow("intensity", { min: 0, max: 1, step: 0.01, value: S.amb.intensity, fmt: (v) => v.toFixed(2) },
      (n) => { S.amb.intensity = n; updateAll(); });
    addColorRow("color", S.amb.color, (c) => { S.amb.color = c; updateAll(); });

    addSection("Shadow");
    addRangeRow("opacity", { min: 0, max: 1, step: 0.01, value: S.shadow.opacity, fmt: (v) => v.toFixed(2) },
      (n) => { S.shadow.opacity = n; updateAll(); });

    addSection("Camera");
    addRangeRow("rotX", { min: 0,   max: 90,  step: 1,   value: S.cam.rotX, fmt: (v) => v.toFixed(0) + "°" },
      (n) => { S.cam.rotX = n; updateAll(); }, "rotX");
    addRangeRow("rotY", { min: 0,   max: 360, step: 1,   value: S.cam.rotY, fmt: (v) => v.toFixed(0) + "°" },
      (n) => { S.cam.rotY = n; updateAll(); }, "rotY");
    addRangeRow("zoom", { min: 0.5, max: 12,  step: 0.1, value: S.cam.zoom, fmt: (v) => v.toFixed(1) },
      (n) => { S.cam.zoom = n; updateAll(); }, "zoom");

    const info = document.createElement("div");
    info.className = "info";
    info.textContent = "All four panes are driven by one state via the public PolyCSS APIs (vanilla setOptions/setTransform/applyCamera, React/Vue props, <poly-scene>/<poly-mesh> attributes). Drag any pane to orbit — the others follow.";
    panel.appendChild(info);

    // First sync push so the initial S lands in every renderer.
    updateAll();
  </script>
</body>
</html>
