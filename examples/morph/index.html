<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>PolyCSS Morph — Plane</title>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <main class="morph-workbench" data-morph-workbench>
      <section class="morph-shell">
        <div class="morph-scene-wrap" data-scene-wrap>
          <div class="morph-scene-grid" aria-hidden="true"></div>
          <div class="morph-scene" data-scene aria-label="Interactive tessellated CSS 3D plane"></div>
          <div class="morph-drag-indicator" data-drag-indicator aria-hidden="true"></div>
          <div class="morph-scene-hint">
            <span>CLICK + DRAG</span>
            Drag terrain to sculpt · drag black space to orbit
          </div>
          <div class="morph-scene-label" data-scene-label>LOADING</div>
        </div>

        <aside class="morph-panel">
          <div class="morph-choice">
            <span>On release</span>
            <div class="morph-segmented" aria-label="Sculpt release behavior">
              <button type="button" data-release="keep" aria-pressed="true">Keep</button>
              <button type="button" data-release="spring" aria-pressed="false">Spring back</button>
            </div>
          </div>

          <div class="morph-choice">
            <span>Zoom</span>
            <div class="morph-zoom-control">
              <button type="button" data-action="zoom-out" aria-label="Zoom out">−</button>
              <input data-zoom type="range" min="20" max="300" step="1" value="72" aria-label="Terrain zoom" />
              <button type="button" data-action="zoom-in" aria-label="Zoom in">+</button>
              <output data-zoom-output>100%</output>
            </div>
          </div>

          <div class="morph-elevation-key">
            <div><span>LOW</span><span>ZERO</span><span>HIGH</span></div>
            <span aria-hidden="true"></span>
          </div>

          <div class="morph-controls morph-controls--reset">
            <button class="morph-reset" type="button" data-action="reset">Reset</button>
            <button class="morph-random" type="button" data-action="random">Random</button>
          </div>

          <pre data-debug hidden></pre>
        </aside>
      </section>
    </main>
  </body>
</html>
