name: Publish Morph

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-morph
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 10.32.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test and build Morph
        run: pnpm --filter @layoutit/polycss-morph test && pnpm --filter @layoutit/polycss-morph build

      - name: Install browser engines
        run: pnpm --filter @layoutit/polycss-morph exec playwright install --with-deps chromium firefox webkit

      - name: Run browser proof
        run: pnpm --filter @layoutit/polycss-morph test:browser

      - name: Certify against registry dependencies
        run: pnpm --filter @layoutit/polycss-morph test:package:registry

      - name: Publish Morph
        run: pnpm --filter @layoutit/polycss-morph publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
